<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Truyện Mộc | Đăng nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b241f;--muted:#8a7b6e;--paper:#f7f1e9;--card:#fffdf9;--line:#e6dacc;--accent:#b96447;--dark:#332b25}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:var(--ink);background:radial-gradient(circle at 10% 10%,#ead6bf,transparent 33%),var(--paper);font:14px "DM Sans",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.shell{display:grid;grid-template-columns:1fr 1fr;width:min(900px,100%);overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 55px rgba(71,47,29,.13)}.visual{display:flex;align-items:end;min-height:590px;padding:35px;background:linear-gradient(145deg,rgba(36,27,20,.5),rgba(36,27,20,.9)),url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=800&q=85') center/cover;color:#fff}.visual h1{margin:10px 0;font:700 39px "Playfair Display",serif;line-height:1.1}.visual p{max-width:290px;color:#eaded3;line-height:1.6}.eyebrow{color:#e7bd78;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.form{padding:52px 45px}.brand{display:block;margin-bottom:43px;color:var(--dark);font:700 23px "Playfair Display",serif;text-decoration:none}.brand span{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;color:#fff;background:var(--accent);border-radius:50%}.form h2{margin:0;font:700 28px "Playfair Display",serif}.sub{margin:8px 0 26px;color:var(--muted)}.tabs{display:flex;gap:20px;margin-bottom:23px;border-bottom:1px solid var(--line)}.tab{padding:10px 0;color:var(--muted);background:none;border-bottom:2px solid transparent}.tab.active{color:var(--accent);border-color:var(--accent);font-weight:700}.field{display:block;margin-bottom:15px;color:#554940;font-weight:600}.field input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);border-radius:5px;outline:none;background:#fff}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(185,100,71,.1)}.submit{width:100%;padding:12px;color:#fff;background:var(--accent);border-radius:5px;font-weight:700}.submit:hover{background:#9f5038}.message{margin-bottom:14px;padding:10px;color:#a44836;background:#fceee8;border-radius:5px;font-size:12px}.message[hidden]{display:none}.hint{margin-top:17px;color:var(--muted);font-size:12px;line-height:1.6}.hint strong{color:var(--ink)}@media(max-width:650px){.shell{display:block}.visual{display:none}.form{padding:38px 27px}.brand{margin-bottom:34px}}
</style></head><body><main class="shell"><section class="visual"><div><div class="eyebrow">Một góc nhỏ dành cho câu chữ</div><h1>Đọc chậm.<br>Nhớ lâu.</h1><p>Đăng nhập để lưu lại hành trình đọc và khám phá những câu chuyện mới.</p></div></section><section class="form"><a class="brand" href="/"><span>M</span>Truyện Mộc</a><h2 id="title">Chào mừng trở lại</h2><p class="sub" id="subtitle">Đăng nhập để tiếp tục đọc truyện.</p><div class="tabs"><button class="tab active" id="loginTab">Đăng nhập</button><button class="tab" id="registerTab">Đăng ký</button></div><form id="authForm"><label class="field">Tên đăng nhập<input id="username" required autocomplete="username"></label><label class="field">Mật khẩu<input id="password" required type="password" minlength="6" autocomplete="current-password"></label><label class="field" id="confirmField" hidden>Xác nhận mật khẩu<input id="confirm" type="password" minlength="6"></label><div class="message" id="message" hidden></div><button class="submit" id="submit">Đăng nhập</button></form><div class="hint">Tài khoản quản trị demo: <strong>admin</strong> / <strong>admin123</strong>. Admin không hiển thị trong menu người dùng.</div></section></main>
<script>
let mode='login';const $=id=>document.getElementById(id);const users=()=>JSON.parse(localStorage.getItem('storyUsers')||'[]');function setMode(next){mode=next;const register=mode==='register';$('loginTab').classList.toggle('active',!register);$('registerTab').classList.toggle('active',register);$('title').textContent=register?'Tạo tài khoản mới':'Chào mừng trở lại';$('subtitle').textContent=register?'Đăng ký để bắt đầu hành trình đọc.':'Đăng nhập để tiếp tục đọc truyện.';$('confirmField').hidden=!register;$('confirm').required=register;$('submit').textContent=register?'Đăng ký':'Đăng nhập';$('message').hidden=true}$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('authForm').onsubmit=e=>{e.preventDefault();const username=$('username').value.trim();const password=$('password').value;if(mode==='register'){if(password!==$('confirm').value)return show('Mật khẩu xác nhận không khớp.');if(username.toLowerCase()==='admin')return show('Tên đăng nhập này không được sử dụng.');const list=users();if(list.some(user=>user.username===username))return show('Tên đăng nhập đã tồn tại.');list.push({username,password,role:'user'});localStorage.setItem('storyUsers',JSON.stringify(list));localStorage.setItem('storySession',JSON.stringify({username,role:'user'}));location.href='/'}else if(username==='admin'&&password==='admin123'){localStorage.setItem('storySession',JSON.stringify({username:'admin',role:'admin'}));location.href='/admin.html'}else if(users().some(user=>user.username===username&&user.password===password)){localStorage.setItem('storySession',JSON.stringify({username,role:'user'}));location.href='/'}else show('Tên đăng nhập hoặc mật khẩu chưa đúng.')};function show(text){$('message').textContent=text;$('message').hidden=false}
</script></body></html>
